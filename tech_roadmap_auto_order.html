<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>편의점 자동 발주 기술로드맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F8F9FB;
  --ink:#151C27; --ink-2:#465263; --ink-3:#7F8A99; --line:#DDE2E9;
  --market:#5B6A7D; --product:#3A4BD6; --tech:#08806F; --resource:#B8730E;
  --vision:#2A35A3; --vision-ink:#FFFFFF; --vision-sub:#C9CEFF;
  --focus:#3A4BD6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A; --surface:#161D27; --surface-2:#1B2330;
    --ink:#E6EBF2; --ink-2:#A9B3C1; --ink-3:#6F7A89; --line:#283240;
    --market:#93A2B6; --product:#8C98FF; --tech:#3CC6AF; --resource:#E5A448;
    --vision:#2C389F; --vision-ink:#FFFFFF; --vision-sub:#C3C9FF;
    --focus:#8C98FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --surface-2:#1B2330;
  --ink:#E6EBF2; --ink-2:#A9B3C1; --ink-3:#6F7A89; --line:#283240;
  --market:#93A2B6; --product:#8C98FF; --tech:#3CC6AF; --resource:#E5A448;
  --vision:#2C389F; --vision-ink:#FFFFFF; --vision-sub:#C3C9FF;
  --focus:#8C98FF; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:40px 28px 72px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.top h1{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.15;font-weight:700;letter-spacing:-.025em}
.top p{margin:10px 0 0;color:var(--ink-2);font-size:15px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* roadmap grid */
.rm{display:grid;grid-template-columns:92px repeat(3,minmax(0,1fr)) minmax(0,.92fr);
  grid-template-rows:auto repeat(5,auto);gap:10px;position:relative}
.time{grid-row:1;font-size:14px;font-weight:600;color:var(--ink);padding:0 4px 14px;position:relative}
.time small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.time.hl{color:var(--product)}
.axis{grid-row:1;grid-column:2 / 6;align-self:end;height:2px;background:var(--line);position:relative;margin-bottom:4px}
.axis::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid var(--line);border-right:0}
.lbl{grid-column:1;display:flex;flex-direction:column;justify-content:center;padding-left:14px;position:relative}
.lbl::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--c)}
.lbl b{font-size:17px;font-weight:600}
.lbl span{font-size:12px;color:var(--ink-3)}

.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;min-height:92px;
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s,opacity .22s}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);transform-origin:left;transition:height .22s}
.card::after{content:"";position:absolute;inset:0;background:var(--c);opacity:0;transition:opacity .22s;pointer-events:none}
.card .t{font-size:16px;font-weight:600;letter-spacing:-.01em;position:relative;z-index:1}
.card .s{font-size:13px;color:var(--ink-2);position:relative;z-index:1}
.card .go{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--c);font-weight:600;opacity:0;transform:translateX(-6px);transition:.22s;z-index:1}
.card .pt{display:none;font-size:11px;color:var(--ink-3)}
.card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
@media (hover:hover){
  .card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 24px -14px var(--c)}
  .card:hover::before{height:5px}
  .card:hover::after{opacity:.05}
  .card:hover .go{opacity:1;transform:none}
  .card:hover .s{padding-right:58px}
  .rm.hovering .card:not(:hover):not(.rel){opacity:.55}
}
.card:active{transform:scale(.98)}

.vision{all:unset;box-sizing:border-box;cursor:pointer;grid-column:5;grid-row:2 / 7;border-radius:14px;
  background:var(--vision);color:var(--vision-ink);padding:28px 22px;display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.vision .ring{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.vision .ring.r2{width:320px;height:320px;right:-110px;top:-110px;border-color:rgba(255,255,255,.1)}
.vision .vt{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0 0 22px}
.vision ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px;color:var(--vision-sub)}
.vision li{display:flex;align-items:center;gap:10px}
.vision li::before{content:"";width:16px;height:2px;background:var(--vision-sub)}
.vision .go{margin-top:26px;font-size:13px;font-weight:600;opacity:.85}
@media (hover:hover){
  .vision:hover{transform:translateY(-3px);box-shadow:0 18px 36px -18px var(--vision)}
  .vision:hover .ring{transform:scale(1.15)}
  .rm.hovering .vision:not(:hover){opacity:.7}
}
.vision:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

.hint{margin-top:22px;font-size:13px;color:var(--ink-3)}

/* detail */
.view{animation:none}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;align-items:start}
.bar{display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;
  padding:8px 14px 8px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);transition:.2s}
.back svg{transition:transform .2s}
.back:hover{border-color:var(--ink-3)}
.back:hover svg{transform:translateX(-3px)}
.back:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.crumb{font-size:13px;color:var(--ink-3)}

.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 30px 26px;overflow:hidden;view-transition-name:hero}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.hero.is-vision{background:var(--vision);border-color:var(--vision);color:var(--vision-ink)}
.hero.is-vision::before{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--c);
  padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.hero.is-vision .chip{color:var(--vision-ink);background:rgba(255,255,255,.14)}
.hero h2{margin:14px 0 4px;font-size:clamp(26px,3.4vw,34px);line-height:1.2;font-weight:700;letter-spacing:-.025em}
.hero .sub{margin:0;color:var(--ink-2);font-size:15px}
.hero.is-vision .sub{color:var(--vision-sub)}
.summary{margin:22px 0 0;font-size:16px;line-height:1.75;max-width:62ch}

.sec{margin-top:34px;opacity:0;transform:translateY(8px);animation:rise .45s cubic-bezier(.2,.8,.2,1) forwards}
.sec h3{margin:0 0 12px;font-size:18px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.sec h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
@keyframes rise{to{opacity:1;transform:none}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px}
th,td{text-align:left;padding:11px 14px;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;white-space:nowrap}
tbody tr{transition:background .15s}
tbody tr:hover{background:color-mix(in srgb,var(--c) 6%,transparent)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{position:relative;padding:12px 14px 12px 34px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:15px}
.list li::before{content:"";position:absolute;left:15px;top:22px;width:8px;height:2px;background:var(--c)}
.formula{font-size:16px;font-weight:600;padding:16px 18px;border-radius:10px;background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);line-height:1.6}
.formula small{display:block;font-weight:400;color:var(--ink-2);font-size:13.5px;margin-top:6px}
.key{margin-top:36px;padding:20px 22px;border-radius:12px;border-left:4px solid var(--c);border-radius:0 12px 12px 0;background:var(--surface);font-size:15.5px}
.key b{display:block;font-size:13px;color:var(--c);margin-bottom:4px}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:44px}
.pg{all:unset;box-sizing:border-box;cursor:pointer;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:.2s;min-width:0}
.pg small{display:block;font-size:12px;color:var(--ink-3)}
.pg span{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.next{text-align:right}
.pg:hover{border-color:var(--c);transform:translateY(-2px)}
.pg:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pg[disabled]{visibility:hidden}

/* minimap */
.mini{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.mini h4{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.mg{display:grid;grid-template-columns:repeat(3,1fr) 34px;gap:4px}
.mc{all:unset;box-sizing:border-box;cursor:pointer;font-size:11px;line-height:1.3;padding:6px 6px 6px 8px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);position:relative;transition:.18s;min-height:30px}
.mc::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:2px;background:var(--c)}
.mc:hover{background:color-mix(in srgb,var(--c) 14%,var(--surface-2));color:var(--ink)}
.mc.on{background:var(--c);color:#fff}
.mc.on::before{display:none}
.mc:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.mv{all:unset;cursor:pointer;grid-column:4;grid-row:1 / 7;border-radius:5px;background:color-mix(in srgb,var(--vision) 70%,var(--surface-2));
  writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:.18s}
.mv.on,.mv:hover{background:var(--vision)}
.mv:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.mini .tip{margin:12px 0 0;font-size:12px;color:var(--ink-3)}

/* view transitions */
.fade-in{animation:viewIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
::view-transition-group(hero){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(hero),::view-transition-new(hero){height:100%;object-fit:none;object-position:top left}

[hidden]{display:none !important}

@media (max-width:960px){
  .detail{grid-template-columns:1fr}
  .mini{position:static}
}
@media (max-width:780px){
  .wrap{padding:28px 18px 56px}
  .rm{display:flex;flex-direction:column;gap:10px}
  .time,.axis{display:none}
  .lbl{padding:18px 0 4px 14px}
  .lbl::before{top:20px;bottom:6px}
  .card .pt{display:block}
  .card .go{display:none}
  .vision{margin-top:14px}
  .hero{padding:24px 20px}
  .pager{grid-template-columns:1fr}
  .pg.next{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <main id="grid-view" class="view">
    <header class="top">
      <div>
        <h1>편의점 자동 발주 기술로드맵</h1>
        <p>추천에서 자동, 자율로. 박스를 누르면 단계별 상세 설계가 열립니다.</p>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--market)"></i>시장</span>
        <span><i style="background:var(--product)"></i>제품</span>
        <span><i style="background:var(--tech)"></i>기술</span>
        <span><i style="background:var(--resource)"></i>자원</span>
      </div>
    </header>
    <div class="rm" id="rm"></div>
    <p class="hint">키보드: Tab으로 이동, Enter로 열기. 상세 화면에서 ← → 로 앞뒤 단계, Esc로 돌아오기.</p>
  </main>

  <main id="detail-view" class="view" hidden></main>
</div>

<script>
const LAYERS = {
  market:{name:"시장",en:"Why",c:"var(--market)"},
  product:{name:"제품",en:"What",c:"var(--product)"},
  tech:{name:"기술",en:"How",c:"var(--tech)"},
  resource:{name:"자원",en:"Resource",c:"var(--resource)"},
  vision:{name:"비전",en:"Goal",c:"var(--vision)"}
};
const PERIODS = ["","단기 0–1년","중기 1–3년","장기 3–5년"];

const N = [
/* ---------------- MARKET ---------------- */
{id:"m1",layer:"market",col:1,t:"발주 업무 부담",s:"인건비·숙련도",
 sum:"점주는 매일 마감 전 수백 개 SKU의 발주량을 경험에 의존해 결정합니다. 시간 부담이 크고, 점주 숙련도에 따라 점포 성과가 크게 갈립니다.",
 sec:[
  {h:"문제 정의",t:["구분","현상","영향"],r:[
   ["시간 부담","매일 반복되는 SKU별 수량 판단","점주 피로, 다른 운영 업무 소홀"],
   ["숙련도 편차","경력 점주와 신규 점주의 판단 차이","신규 점포 조기 안정화 어려움"],
   ["인력 구조","인건비 상승, 아르바이트 잦은 이직","발주를 위임할 사람 부족"]]},
  {h:"이해관계자별 가치",t:["대상","얻는 가치"],r:[
   ["점주","발주 시간 단축, 판단 부담 감소"],
   ["본부","가맹점 성과 평준화, 신규점 안정화"],
   ["고객","원하는 상품이 있을 확률 상승"]]},
  {h:"현장에서 검증할 가설",list:[
   "점주는 시간 절감보다 폐기·결품 손실 감소에 더 크게 반응한다",
   "신규 점주일수록 추천 수용도가 높다",
   "점주가 추천을 거부하는 주된 이유는 정확도가 아니라 근거 부족이다"]}
 ],
 key:"발주는 점주의 가장 반복적이고 숙련 의존적인 업무입니다. 자동화의 1차 고객 가치는 ‘시간’이 아니라 ‘성과 평준화’에 있을 가능성이 큽니다."},

{id:"m2",layer:"market",col:2,t:"폐기·결품 손실",s:"점포 수익성",
 sum:"신선식품 비중이 커질수록 과잉 발주는 폐기로, 과소 발주는 결품으로 수익이 새어 나갑니다. 두 손실은 서로 반대 방향으로 움직입니다.",
 sec:[
  {h:"손실 구조",t:["원인","결과","부담 주체"],r:[
   ["과잉 발주","유통기한 경과 폐기","점주 (본부 폐기 지원 정책에 따라 분담)"],
   ["과소 발주","품절에 따른 판매 기회 손실","점주·본부 모두, 고객 이탈로 장기화"],
   ["진열 공백","매대가 비어 보여 구매 감소","점주"]]},
  {h:"목표 지표 설계",formula:"총손실 = 폐기 원가 + 결품 기회손실<small>폐기율만 낮추면 결품이 늘고, 결품만 줄이면 폐기가 늘어납니다. 단일 지표가 아닌 총손실 최소화를 목표로 둡니다.</small>"},
  {h:"측정 방법",t:["지표","산식","비고"],r:[
   ["폐기율","폐기 수량 ÷ 입고 수량","폐기 등록 누락 보정 필요"],
   ["결품률","품절 시간 ÷ 영업 시간","POS 판매 공백으로 추정"],
   ["기회손실","결품 시간 × 추정 시간당 수요","수요예측 모델과 연계"]]}
 ],
 key:"‘폐기를 줄이자’가 아니라 ‘총손실을 줄이자’로 문제를 정의해야 점주와 본부가 같은 숫자를 봅니다."},

{id:"m3",layer:"market",col:3,t:"무인 점포 확산",s:"하이브리드 운영",
 sum:"야간 무인, 주간 유인 같은 하이브리드 점포가 늘어나면 사람이 발주할 시간 자체가 줄어듭니다. 이때 자율 발주는 선택이 아닌 운영의 전제 조건이 됩니다.",
 sec:[
  {h:"변화 동인",t:["동인","내용"],r:[
   ["인력","심야 인력 확보 어려움, 인건비 부담"],
   ["기술","무인 결제, 출입 인증, 원격 관제의 보편화"],
   ["고객","비대면 구매에 대한 거부감 감소"]]},

const ORDER = ["m1","m2","m3","p1","p2","p3","t1","t2","t3","t4","t5","t6","r1","r2","r3","v"];
const byId = Object.fromEntries(N.map(n=>[n.id,n]));
const ROW = {market:2,product:3,tech:4,resource:6};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- grid ---------- */
const rm = document.getElementById("rm");
function buildGrid(){
  let h = "";
  PERIODS.forEach((p,i)=>{ if(i) h += `<div class="time" data-col="${i}" style="grid-column:${i+1}">${p}</div>`; });
  h += `<div class="time" style="grid-column:5">비전<small>도착점</small></div><div class="axis" aria-hidden="true"></div>`;
  ["market","product","tech","resource"].forEach(L=>{
    const lay = LAYERS[L], r = ROW[L], span = L==="tech" ? `${r} / ${r+2}` : r;
    h += `<div class="lbl" style="--c:${lay.c};grid-row:${span}"><b>${lay.name}</b><span>${lay.en}</span></div>`;
    N.filter(n=>n.layer===L).forEach(n=>{
      const row = L==="tech" ? r + n.slot : r;
      h += `<button class="card" data-id="${n.id}" data-col="${n.col}" style="--c:${lay.c};grid-column:${n.col+1};grid-row:${row}"
        aria-label="${esc(n.t)} 상세 보기">
        <span class="pt">${PERIODS[n.col]}</span>
        <span class="t">${esc(n.t)}</span><span class="s">${esc(n.s)}</span><span class="go" aria-hidden="true">상세 보기</span></button>`;
    });
  });
  h += `<button class="vision" data-id="v" aria-label="비전 상세 보기">
    <span class="ring" aria-hidden="true"></span><span class="ring r2" aria-hidden="true"></span>
    <p class="vt">무인 자율<br>운영 점포</p>
    <ul><li>결품률 최소화</li><li>폐기율 최소화</li><li>발주 시간 제로</li></ul>
    <span class="go">비전 자세히 보기</span></button>`;
  rm.innerHTML = h;

  rm.addEventListener("click", e=>{
    const b = e.target.closest("[data-id]"); if(!b || !b.matches("button")) return;
    open(b.dataset.id, b);
  });
  rm.addEventListener("mouseover", e=>{
    const b = e.target.closest(".card,.vision");
    rm.querySelectorAll(".rel").forEach(x=>x.classList.remove("rel"));
    rm.querySelectorAll(".time.hl").forEach(x=>x.classList.remove("hl"));
    if(!b){ rm.classList.remove("hovering"); return; }
    rm.classList.add("hovering");
    const col = b.dataset.col;
    if(col){
      rm.querySelectorAll(`.card[data-col="${col}"]`).forEach(x=>x.classList.add("rel"));
      const t = rm.querySelector(`.time[data-col="${col}"]`); if(t) t.classList.add("hl");
    }
  });
  rm.addEventListener("mouseleave", ()=>{
    rm.classList.remove("hovering");
    rm.querySelectorAll(".rel,.time.hl").forEach(x=>x.classList.remove("rel","hl"));
  });
}

/* ---------- detail ---------- */
const gridView = document.getElementById("grid-view");
const detailView = document.getElementById("detail-view");

function section(s,i){
  let body = "";
  if(s.t) body = `<div class="tbl"><table><thead><tr>${s.t.map(x=>`<th scope="col">${esc(x)}</th>`).join("")}</tr></thead>
    <tbody>${s.r.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  else if(s.list) body = `<ul class="list">${s.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  else if(s.formula) body = `<div class="formula">${s.formula}</div>`;
  return `<section class="sec" style="animation-delay:${80+i*60}ms"><h3>${esc(s.h)}</h3>${body}</section>`;
}
function mini(cur){
  let h = `<div class="mg">`;
  const rows = [["market"],["product"],["tech",0],["tech",1],["resource"]];
  rows.forEach((rw,ri)=>{
    for(let c=1;c<=3;c++){
      const n = N.find(x=>x.layer===rw[0] && x.col===c && (rw[1]===undefined || x.slot===rw[1]));
      h += `<button class="mc${n.id===cur?" on":""}" style="--c:${LAYERS[n.layer].c};grid-column:${c};grid-row:${ri+1}" data-id="${n.id}"
        ${n.id===cur?'aria-current="page"':""}>${esc(n.t)}</button>`;
    }
  });
  h += `<button class="mv${cur==="v"?" on":""}" data-id="v" style="grid-row:1 / 6" ${cur==="v"?'aria-current="page"':""}>비전</button></div>`;
  return h;
}
function renderDetail(id){
  const n = byId[id], L = LAYERS[n.layer], i = ORDER.indexOf(id);
  const prev = byId[ORDER[i-1]], next = byId[ORDER[i+1]];
  const period = n.layer==="vision" ? "도착점" : PERIODS[n.col];
  detailView.style.setProperty("--c", L.c);
  detailView.innerHTML = `
    <div class="bar">
      <button class="back" id="back"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>로드맵</button>
      <span class="crumb">${L.name} (${L.en}) / ${period}</span>
    </div>
    <div class="detail">
      <article>
        <header class="hero${n.layer==="vision"?" is-vision":""}">
          <span class="chip">${L.name} · ${period}</span>
          <h2 tabindex="-1" id="dt">${esc(n.t)}</h2>
          <p class="sub">${esc(n.s)}</p>
          <p class="summary">${esc(n.sum)}</p>
        </header>
        ${n.sec.map(section).join("")}
        <div class="key sec" style="animation-delay:${80+n.sec.length*60}ms"><b>핵심 메시지</b>${esc(n.key)}</div>
        <nav class="pager" aria-label="단계 이동">
          <button class="pg" data-id="${prev?prev.id:""}" ${prev?"":"disabled"}><small>이전</small><span>${prev?esc(prev.t):""}</span></button>
          <button class="pg next" data-id="${next?next.id:""}" ${next?"":"disabled"}><small>다음</small><span>${next?esc(next.t):""}</span></button>
        </nav>
      </article>
      <aside class="mini" aria-label="로드맵 미니맵">
        <h4>로드맵에서 위치</h4>${mini(id)}
        <p class="tip">다른 칸을 누르면 바로 이동합니다.</p>
      </aside>
    </div>`;
  detailView.querySelector("#back").onclick = ()=>go("");
  detailView.querySelectorAll(".pg[data-id]:not([disabled]),.mc,.mv").forEach(b=>b.onclick=()=>go(b.dataset.id));
}

/* ---------- routing with transitions ---------- */
let current = "";
const canVT = typeof document.startViewTransition === "function" &&
  !matchMedia("(prefers-reduced-motion: reduce)").matches;

function open(id, srcEl){ go(id, srcEl); }
function go(id, srcEl){
  const target = id ? "#/" + id : "#/";
  if(location.hash === target){ route(srcEl); return; }
  pendingSrc = srcEl || null;
  location.hash = target;
}
let pendingSrc = null;
let gridScroll = 0;

function swap(next){
  const fromGrid = !current, toGrid = !next;
  if(fromGrid && !toGrid) gridScroll = scrollY;
  if(toGrid){
    detailView.hidden = true; gridView.hidden = false;
  } else {
    renderDetail(next); gridView.hidden = true; detailView.hidden = false;
  }
  current = next;
}
function afterSwap(next){
  if(next){
    window.scrollTo({top:0});
    const h = document.getElementById("dt"); if(h) h.focus({preventScroll:true});
  } else {
    window.scrollTo({top:gridScroll});
    const b = rm.querySelector(`[data-id="${lastId}"]`); if(b) b.focus({preventScroll:true});
  }
}
let lastId = "";
function route(){
  const m = location.hash.match(/^#\/(\w+)$/);
  const next = m && byId[m[1]] ? m[1] : "";
  if(next === current){ return; }
  const fromGrid = !current, toGrid = !next;
  const src = pendingSrc || (fromGrid && next ? rm.querySelector(`[data-id="${next}"]`) : null);
  pendingSrc = null;
  if(next) lastId = next;

  if(canVT){
    if(fromGrid && src) src.style.viewTransitionName = "hero";
    const t = document.startViewTransition(()=>{
      if(src) src.style.viewTransitionName = "";
      swap(next);
      if(toGrid){
        const back = rm.querySelector(`[data-id="${lastId}"]`);
        if(back) back.style.viewTransitionName = "hero";
      }
      afterSwap(next);
    });
    t.finished.finally(()=>rm.querySelectorAll("[data-id]").forEach(b=>b.style.viewTransitionName=""));
  } else {
    swap(next);
    const v = next ? detailView : gridView;
    v.classList.remove("fade-in"); void v.offsetWidth; v.classList.add("fade-in");
    afterSwap(next);
  }
}
window.addEventListener("hashchange", ()=>route());
document.addEventListener("keydown", e=>{
  if(!current) return;
  if(e.target.matches("input,textarea")) return;
  const i = ORDER.indexOf(current);
  if(e.key==="Escape") go("");
  else if(e.key==="ArrowRight" && ORDER[i+1]) go(ORDER[i+1]);
  else if(e.key==="ArrowLeft" && ORDER[i-1]) go(ORDER[i-1]);
});

buildGrid();
route();
</script>
